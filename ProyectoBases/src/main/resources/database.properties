# Configuración de conexión a SQL Server, usada por
# com.tuempresa.backend.config.DatabaseConfig.
#
# Este archivo vive aquí (en ProyectoBases, no en el backend) porque
# es el proyecto que finalmente se empaqueta y despliega en Tomcat.
# Al compilar el WAR, Maven copia todo src/main/resources dentro de
# WEB-INF/classes, que es justamente donde DatabaseConfig lo busca en
# tiempo de ejecución (via getClassLoader().getResourceAsStream()).
#
# IMPORTANTE: no subir este archivo con credenciales reales a un
# repositorio público.

db.host=localhost
db.port=1433
db.name=NombreDeTuBaseDeDatos
db.user=tu_usuario
db.password=tu_password
